
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  checks:
    name: Lint, Type Check, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code with Biome
        run: npm run lint

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npm test

      - name: Build Next.js application
        run: npm run build
